name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # macOS / Linux：全量测试 + Schema + 敏感扫描 + branch coverage
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Full test suite
        run: python -m pytest -p no:cacheprovider tests/ -q
      - name: Schema validation
        run: python tools/validate_schemas.py
      - name: Sensitive-data scan
        run: python tools/scan_sensitive.py
      - name: Branch coverage (≥90%)
        run: |
          COVERAGE_FILE=/tmp/deadlatch-ci.coverage python -m pytest -p no:cacheprovider \
            --cov-branch --cov=deadlatch --cov-report=term tests/ -q

  # Windows：核心规则计算 + 审计写入不支持契约。
  # 不是完整 Windows 审计验收成功。POSIX fcntl 跨进程锁不适用。
  # 原六文件保留，另加平台回归；原生执行，不 skip、不 continue-on-error。
  test-windows:
    name: test-windows (py${{ matrix.python-version }})
    env:
      # FIX-008B-1：Windows 上强制 UTF-8（源码/输出均为 UTF-8，避免 cp1252 解码失败）
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Core compute and unsupported-audit contract
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_rules_basic.py tests/test_rules_r12.py tests/test_engine.py
          tests/test_guard_api.py tests/test_cli.py tests/test_cli_inprocess.py
          tests/test_audit_platform.py -q
      - name: Schema validation
        run: python tools/validate_schemas.py
      - name: Sensitive-data scan
        run: python tools/scan_sensitive.py

  # Linux root 容器全量：只允许权限位三测试与无 lsof 的唯一对应测试 skip
  test-linux-root:
    name: test-linux-root
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bookworm
      options: --user 0
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v5
      - name: Confirm root
        run: test "$(id -u)" -eq 0
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Full test suite as root
        run: python -m pytest -p no:cacheprovider tests/ -q --tb=short

  # 独立 build job：构建 wheel/sdist、检查产物、wheel 全新 venv 验证
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: python -m pip install -e ".[test,build]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect artifacts (no runtime data / secrets)
        run: python tools/inspect_dist.py dist
      - name: Verify wheel in fresh venv outside the source tree
        run: python tools/verify_wheel.py dist/*.whl
