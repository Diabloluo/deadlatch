name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the exact pyproject version to publish (for example 0.1.0). Pre-releases are rejected."
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Full test suite
        run: python -m pytest -p no:cacheprovider tests/ -q
      - name: Schema validation
        run: python tools/validate_schemas.py
      - name: Sensitive-data scan
        run: python tools/scan_sensitive.py
      - name: Branch coverage (≥90%)
        run: |
          COVERAGE_FILE=/tmp/deadlatch-ci.coverage python -m pytest -p no:cacheprovider \
            --cov-branch --cov=deadlatch --cov-report=term tests/ -q

  test-windows:
    name: test-windows (py${{ matrix.python-version }})
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Core compute and unsupported-audit contract
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_rules_basic.py tests/test_rules_r12.py tests/test_engine.py
          tests/test_guard_api.py tests/test_cli.py tests/test_cli_inprocess.py
          tests/test_audit_platform.py -q
      - name: Schema validation
        run: python tools/validate_schemas.py
      - name: Sensitive-data scan
        run: python tools/scan_sensitive.py

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: python -m pip install -e ".[test,build]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect artifacts (no runtime data / secrets)
        run: python tools/inspect_dist.py dist
      - name: Verify wheel in fresh venv outside the source tree
        run: python tools/verify_wheel.py dist/*.whl

  publish:
    name: publish-pypi
    needs: [test, test-windows, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deadlatch
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: python -m pip install -e ".[test,build]"
      - name: Confirm version and refuse pre-releases
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          confirm = os.environ["CONFIRM"]
          if version != confirm:
              print("confirm does not match pyproject version", file=sys.stderr)
              sys.exit(1)
          if re.search(r"(dev|a|b|rc|pre)", version, re.I):
              print("refusing to publish a pre-release", file=sys.stderr)
              sys.exit(1)
          print(version)
          PY
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect artifacts (no runtime data / secrets)
        run: python tools/inspect_dist.py dist
      - name: Verify wheel in fresh venv outside the source tree
        run: python tools/verify_wheel.py dist/*.whl
      - name: Print publish-set hashes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path("dist").iterdir()):
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{path.name} {path.stat().st_size} {digest}")
          PY
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # 2026-09-13 readback of pypa official release/v1
